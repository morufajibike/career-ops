name: Release Please
on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - id: release
        uses: googleapis/release-please-action@5c625bfb5d1ff62eadeeb3772007f7f66fdcf071 # v4.4.1
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      # release-please bumps package.json on the node release type, but the bare
      # VERSION file (consumed by update-system.mjs as plain semver, so it cannot
      # carry an x-release-please marker) must be synced from the released tag.
      # Only runs when a release is actually cut, never on the release-PR push.
      - name: Checkout for VERSION sync
        if: ${{ steps.release.outputs.release_created }}
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Sync VERSION file to released tag
        if: ${{ steps.release.outputs.release_created }}
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: |
          printf '%s\n' "$RELEASE_VERSION" > VERSION
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add VERSION
          git diff --cached --quiet || git commit -m "chore: sync VERSION to ${RELEASE_VERSION}"
          git push
