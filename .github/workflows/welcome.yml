# SECURITY (pwn-request prevention): this workflow runs on `pull_request_target`,
# which executes with a read/write token and access to repository secrets in the
# context of the BASE repository. It must therefore NEVER check out, build, run,
# or otherwise execute code from the PR head (the fork). Do NOT add an
# `actions/checkout` of the PR head/ref, and do NOT run any PR-supplied scripts
# here. actions/first-interaction only posts a fixed greeting via the API, so it
# is safe — keep it that way. See:
# https://securitylab.github.com/resources/github-actions-preventing-pwn-requests/
name: Welcome

on:
  pull_request_target:
    types: [opened]
  issues:
    types: [opened]

jobs:
  welcome:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
    steps:
      - uses: actions/first-interaction@1c4688942c71f71d4f5502a26ea67c331730fa4d # v3.1.0
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          pr_message: |
            Welcome to career-ops, @${{ github.actor }}! Thanks for your first PR.

            A few things to know:
            - Tests will run automatically — check the status below
            - Make sure you've linked a related issue (required for features)
            - Read [CONTRIBUTING.md](https://github.com/santifer/career-ops/blob/main/CONTRIBUTING.md) if you haven't

            We'll review your PR soon. Join our [Discord](https://discord.gg/8pRpHETxa4) if you have questions.
          issue_message: |
            Thanks for opening your first issue, @${{ github.actor }}! We'll take a look soon.

            In the meantime:
            - Check [SUPPORT.md](https://github.com/santifer/career-ops/blob/main/SUPPORT.md) for setup help
            - Join our [Discord](https://discord.gg/8pRpHETxa4) for quick answers
